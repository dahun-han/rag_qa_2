total_count: 6                   # 실제로 생성할 목표 문항 수(세 청킹방식 전체 합계)

chunk_method_ratio:                 # 청킹방식별 비중 - total_count를 이 비율로 나눈다.
  recursive_300_100: 1              # 0으로 두면 그 방식은 문항도 0건, 산출물 파일도 안 만든다.
  recursive_600_200: 1
  recursive_1000_300: 1

data_type_ratio:                   # pos_neg : all_pos : all_neg 비중
  pos_neg: 6
  all_pos: 1
  all_neg: 3

difficulty_ratio:                  # 하 : 중 : 상 비중
  하: 0.25
  중: 0.5
  상: 0.25

category_ratio:                    # 카테고리별 비중
  LS: 0.3                          # 여신-다훈
  DS: 0.3                          # 수신-다훈
  FX: 0.3                          # 외환-다훈
  CD: 0                          # 내부통제-혜규
  WM: 0                          # 자산관리-혜규
  CR: 0                            # 고객관리-혜규

persona_ratio:                     # 고객 : 내부직원 비중
  고객: 0.5
  내부직원: 0.5

start_seq:
  recursive_300_100: 545  #0819 기준 업데이트
  recursive_600_200: 543  #0819 기준 업데이트
  recursive_1000_300: 546 #0819 기준 업데이트

candidate_pool_size:                # data_type별 candidate pool(문서기준) 구성 방식
  pos_neg: {mode: doc_count, min: 50, max: 50}  
  all_pos: {mode: doc_count, min: 50, max: 50}
  all_neg: {mode: doc_count, min: 50, max: 50}

retrieval_eval:                      # 모의 검색 top_k 범위 - 문항마다 이 범위에서 랜덤 선택
  top_k_min: 5
  top_k_max: 5
